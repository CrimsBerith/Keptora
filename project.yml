name: Keptora
options:
  bundleIdPrefix: com.alfagolab
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  defaultConfig: Release
  developmentLanguage: en
  knownRegions: [en, tr, de, fr, Base]

configs:
  Debug: debug
  Release: release

packages:
  KeptoraCore:
    path: Packages/KeptoraCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17

targets:
  Keptora:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Keptora
        excludes:
          - Resources
      - path: Keptora/Resources/Assets.xcassets
        buildPhase: resources
      - path: Keptora/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Keptora/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: KeptoraCore
    settings:
      base:
        PRODUCT_NAME: Keptora
        PRODUCT_BUNDLE_IDENTIFIER: com.alfagolab.keptora
        INFOPLIST_FILE: Keptora/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Keptora/Resources/Keptora.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "ZSRUTGX74S"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        CURRENT_PROJECT_VERSION: "182"
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: -lsqlite3
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          ENABLE_TESTABILITY: YES

  KeptoraTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: KeptoraTests
    dependencies:
      - target: Keptora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alfagolab.keptora.tests
        DEVELOPMENT_TEAM: "ZSRUTGX74S"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Keptora.app/Contents/MacOS/Keptora"
        BUNDLE_LOADER: "$(TEST_HOST)"

  KeptoraUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: KeptoraUITests
    dependencies:
      - target: Keptora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alfagolab.keptora.uitests
        TEST_TARGET_NAME: Keptora
        DEVELOPMENT_TEAM: "ZSRUTGX74S"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES

  KeptoraiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeptoraiOS
        excludes:
          - Resources
      - path: Keptora/Resources/Assets.xcassets
        buildPhase: resources
      - path: KeptoraiOS/Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - KeptoraiOS.entitlements
          - en.lproj/Localizable.strings
          - tr.lproj/Localizable.strings
          - de.lproj/Localizable.strings
          - fr.lproj/Localizable.strings
      - path: Keptora/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Keptora/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: KeptoraCore
    settings:
      base:
        PRODUCT_NAME: Keptora
        PRODUCT_MODULE_NAME: KeptoraiOS
        PRODUCT_BUNDLE_IDENTIFIER: com.alfagolab.keptora
        INFOPLIST_FILE: KeptoraiOS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: KeptoraiOS/Resources/KeptoraiOS.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "ZSRUTGX74S"
        CODE_SIGN_IDENTITY: ""
        CURRENT_PROJECT_VERSION: "182"
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  KeptoraiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeptoraiOSTests
    dependencies:
      - target: KeptoraiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alfagolab.keptora.ios.tests
        DEVELOPMENT_TEAM: "ZSRUTGX74S"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Keptora.app/Keptora"
        BUNDLE_LOADER: "$(TEST_HOST)"

  KeptoraiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeptoraiOSUITests
    dependencies:
      - target: KeptoraiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alfagolab.keptora.ios.uitests
        TEST_TARGET_NAME: KeptoraiOS
        DEVELOPMENT_TEAM: "ZSRUTGX74S"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Keptora:
    build:
      targets:
        Keptora: all
        KeptoraTests: [test]
        KeptoraUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Keptora/Resources/Keptora.storekit
    test:
      config: Debug
      targets:
        - KeptoraTests
        - KeptoraUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  KeptoraiOS:
    build:
      targets:
        KeptoraiOS: all
        KeptoraiOSTests: [test]
        KeptoraiOSUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Keptora/Resources/Keptora.storekit
    test:
      config: Debug
      targets:
        - KeptoraiOSTests
        - KeptoraiOSUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
